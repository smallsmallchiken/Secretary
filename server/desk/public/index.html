<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="桌宠">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>桌宠</title>
<style>
  :root{
    --bg:#111318; --card:rgba(255,255,255,.055); --line:rgba(255,255,255,.09);
    --txt:#eceef2; --dim:#8b91a0; --accent:#ffc857; --ok:#4ade80; --bad:#f87171;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 80% at 50% 0%, #1d2029 0%, var(--bg) 55%, #0c0e12 100%);
    color:var(--txt);
    font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
    display:flex;flex-direction:column;
    height:100dvh;overflow:hidden;
    overscroll-behavior:none;
  }

  /* ---------- 顶部 ---------- */
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 4px;flex:0 0 auto}
  .name{font-size:15px;font-weight:600;letter-spacing:.3px}
  .name small{color:var(--dim);font-weight:400;margin-left:6px;font-size:12px}
  .dot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim)}
  .dot i{width:7px;height:7px;border-radius:50%;background:var(--dim);transition:.3s}
  .dot.on i{background:var(--ok);box-shadow:0 0 0 3px rgba(74,222,128,.16)}
  .dot.on{color:var(--ok)}

  /* ---------- 桌宠 ---------- */
  .stage{position:relative;display:flex;align-items:center;justify-content:center;
         flex:0 0 auto;height:clamp(150px,30vh,215px);padding:2px 0}
  .glow{position:absolute;width:220px;height:220px;border-radius:50%;
        background:radial-gradient(circle,rgba(255,200,87,.16) 0%,rgba(255,200,87,0) 68%);
        filter:blur(4px);pointer-events:none}
  #pet{position:relative;width:min(42vw,168px);height:auto;cursor:pointer;
       transition:filter .4s,opacity .4s}
  body.offline #pet{filter:grayscale(1) brightness(.55);opacity:.65}

  .bubble{
    position:absolute;bottom:0;left:50%;transform:translate(-50%,8px);
    max-width:88%;padding:8px 13px;border-radius:14px 14px 14px 4px;
    background:#262b36;border:1px solid var(--line);color:var(--txt);font-size:13.5px;
    opacity:0;pointer-events:none;transition:.25s;white-space:pre-wrap;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .bubble.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- 桌宠的两个动作 ---------- */
  .pets{display:flex;gap:8px;justify-content:center;margin:2px 0 12px;flex:0 0 auto}
  .ghost{
    font:inherit;font-size:12.5px;color:#c8ccd6;background:var(--card);
    border:1px solid var(--line);border-radius:16px;padding:7px 16px;cursor:pointer;
    transition:transform .12s,background .2s;
  }
  .ghost:active{transform:scale(.95);background:rgba(255,255,255,.12)}

  /* ---------- 备忘录 ---------- */
  .memo{
    flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;margin-bottom:10px;
  }
  .memo-h{display:flex;align-items:center;gap:8px;padding:11px 12px 9px;
          font-size:13px;color:var(--dim);flex:0 0 auto;border-bottom:1px solid var(--line)}
  .memo-h b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
  .memo-h .grow{flex:1}
  .memo-h .t{font-size:11.5px;font-variant-numeric:tabular-nums}
  .icon-btn{
    background:none;border:0;color:var(--dim);font-size:16px;line-height:1;padding:4px 2px;
    cursor:pointer;transition:transform .3s,color .2s;
  }
  .icon-btn:active{color:var(--accent)}
  .icon-btn.spin{transform:rotate(360deg);color:var(--accent)}

  .list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0 6px;flex:1 1 auto;min-height:0}
  .item{display:flex;gap:10px;padding:10px 13px;align-items:flex-start;cursor:pointer;
        transition:background .15s}
  .item:active{background:rgba(255,255,255,.06)}
  .box{
    flex:0 0 auto;width:18px;height:18px;margin-top:1px;border-radius:6px;
    border:1.5px solid rgba(255,255,255,.24);display:flex;align-items:center;justify-content:center;
    font-size:12px;color:transparent;transition:.18s;
  }
  .item.done .box{background:var(--ok);border-color:var(--ok);color:#0d2417}
  .tt{font-size:14px;line-height:1.42;word-break:break-word}
  .item.done .tt{color:#6a7080;text-decoration:line-through}
  .mt{font-size:11.5px;color:var(--dim);margin-top:3px}
  .item.flash{animation:flash 1.6s ease-out}
  @keyframes flash{0%{background:rgba(255,200,87,.18)}100%{background:transparent}}

  .empty{padding:26px 20px;text-align:center;color:var(--dim);font-size:13px;line-height:1.8}
  .empty span{font-size:11.5px;opacity:.75}

  /* ---------- 输入 ---------- */
  .say{display:flex;gap:8px;margin-bottom:max(8px,env(safe-area-inset-bottom));flex:0 0 auto}
  .say input{
    flex:1;font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);
    border-radius:22px;padding:12px 16px;outline:none;min-width:0;
  }
  .say input:focus{border-color:rgba(255,200,87,.5)}
  .say input::placeholder{color:#6a7080}
  .say button{width:46px;height:46px;padding:0;border-radius:50%;background:var(--accent);
              border:none;color:#221c07;flex:0 0 auto;font-size:17px;cursor:pointer}
  .say button:active{transform:scale(.94)}

  /* ---------- 提示条 ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
    background:#2c313d;border:1px solid var(--line);color:var(--txt);font-size:13px;
    padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;
    max-width:88vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:9;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.bad{border-color:rgba(248,113,113,.4);background:#3a2426}

  /* ---------- 首次填口令 ---------- */
  .gate{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;
        align-items:center;justify-content:center;gap:14px;padding:28px;z-index:30}
  .gate.show{display:flex}
  .gate h2{margin:0;font-size:17px;font-weight:600}
  .gate p{margin:0;color:var(--dim);font-size:13px;text-align:center;line-height:1.6}
  .gate input{width:100%;max-width:300px;font:inherit;color:var(--txt);background:var(--card);
              border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;text-align:center}
  .gate button{width:100%;max-width:300px;background:var(--accent);color:#221c07;border:none;
               border-radius:12px;padding:13px;font-weight:600}

  /* 底部「装成 App」入口：在 APK 壳里打开时由 JS 保持隐藏 */
  .getapp{display:none;text-align:center;margin:2px 16px 10px;font-size:12px;
    color:var(--dim);text-decoration:none;letter-spacing:.3px;flex:0 0 auto}
  .getapp.show{display:block}
  .getapp b{color:var(--accent);font-weight:600}
</style>
</head>
<body class="offline">

<header>
  <div class="name">比格多栋<small id="host"></small></div>
  <div class="dot" id="conn"><i></i><span id="connTxt">连接中</span></div>
</header>

<div class="stage">
  <div class="glow"></div>
  <canvas id="pet" width="192" height="208"></canvas>
  <div class="bubble" id="bubble"></div>
</div>

<div class="pets">
  <button class="ghost" id="btnPoke">戳一下</button>
  <button class="ghost" id="btnWalk">溜达一圈</button>
</div>

<section class="memo">
  <div class="memo-h">
    <span>今天的待办 <b id="memoNum">—</b></span>
    <span class="grow"></span>
    <span class="t" id="memoTime"></span>
    <button class="icon-btn" id="btnSync" title="刷新">↻</button>
  </div>
  <div class="list" id="list">
    <div class="empty">正在拿今天的清单…</div>
  </div>
</section>

<div class="say">
  <input id="msg" placeholder="跟它说点什么…" autocomplete="off" enterkeyhint="send">
  <button id="btnSend">↑</button>
</div>

<a class="getapp" id="getApp" href="desk.apk" download>想常驻手机？<b>装成 App</b>（约 0.3MB）</a>

<div class="toast" id="toast"></div>

<div class="gate" id="gate">
  <h2>需要访问口令</h2>
  <p>在地址后面带上 <code>?t=口令</code> 打开一次即可，之后会记住。</p>
  <input id="gateInput" placeholder="粘贴口令" autocomplete="off">
  <button id="gateOk">进去</button>
</div>

<script>
(() => {
  'use strict';

  /* ---------------- 口令 ---------------- */
  const params = new URLSearchParams(location.search);
  let token = params.get('t') || localStorage.getItem('desk_token') || '';
  if (params.get('t')) {
    localStorage.setItem('desk_token', params.get('t'));
    // 把口令从地址栏抹掉，免得被截图/分享带出去
    history.replaceState(null, '', location.pathname);
  }
  const gate = document.getElementById('gate');
  if (!token) gate.classList.add('show');
  document.getElementById('gateOk').onclick = () => {
    const v = document.getElementById('gateInput').value.trim();
    if (!v) return;
    token = v;
    localStorage.setItem('desk_token', v);
    gate.classList.remove('show');
    tick();
  };
  // 路径一律相对：页面挂在 nginx 的 /desk/ 下，绝对路径会掉到站点根去
  const api = (p) => p + (p.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(token);

  /* ---------------- 桌宠动画 ---------------- */
  // 雪碧图 1536×1872，8 列 × 9 行，单帧 192×208；行含义与渲染端 src/renderer/pet/pet.js 一致
  const FW = 192, FH = 208;
  const ANIM = {
    idle:   { row: 0, frames: 6, fps: 7  },
    walk_r: { row: 1, frames: 8, fps: 12 },
    walk_l: { row: 2, frames: 8, fps: 12 },
    sleep:  { row: 3, frames: 4, fps: 3.5 },
    sit:    { row: 4, frames: 5, fps: 5  },
    sad:    { row: 5, frames: 8, fps: 9  },
    stand:  { row: 6, frames: 6, fps: 5  },
    think:  { row: 7, frames: 6, fps: 8  },
    happy:  { row: 8, frames: 6, fps: 13 }
  };
  const cvs = document.getElementById('pet');
  const ctx = cvs.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cvs.width = FW * dpr;
  cvs.height = FH * dpr;
  ctx.scale(dpr, dpr);

  const sheet = new Image();
  let loaded = false;
  sheet.onload = () => { loaded = true; };
  sheet.src = 'spritesheet.webp';

  let cur = 'idle', frame = 0, last = 0, holdUntil = 0;
  function draw(t) {
    if (loaded) {
      const a = ANIM[cur] || ANIM.idle;
      if (!holdUntil || t > holdUntil) {
        if (t - last > 1000 / a.fps) {
          frame = (frame + 1) % a.frames;
          last = t;
        }
      }
      ctx.clearRect(0, 0, FW, FH);
      ctx.drawImage(sheet, frame * FW, a.row * FH, FW, FH, 0, 0, FW, FH);
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // 临时做个动作，做完回 idle
  function play(name, ms) {
    cur = name; frame = 0; last = 0;
    holdUntil = performance.now() + (ms || 1400);
    setTimeout(() => { if (cur === name) { cur = online ? 'idle' : 'sleep'; } }, ms || 1400);
  }

  /* ---------------- 气泡 / 提示 ---------------- */
  const bubble = document.getElementById('bubble');
  let bubbleTimer = null;
  function say(text) {
    if (!text) return;
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    // 字多的停久一点，但别超过 12 秒
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'),
      Math.min(12000, 2600 + text.length * 90));
  }
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(text, bad) {
    toastEl.textContent = text;
    toastEl.classList.toggle('bad', !!bad);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  /* ---------------- 连接状态 ---------------- */
  let online = false;
  function setConn(on) {
    online = on;
    document.body.classList.toggle('offline', !on);
    document.getElementById('conn').classList.toggle('on', on);
    document.getElementById('connTxt').textContent = on ? '在线' : '离线';
    if (!on) { cur = 'sleep'; frame = 0; }
    else if (cur === 'sleep') { cur = 'idle'; frame = 0; }
  }

  /* ---------------- 备忘录 ---------------- */
  const listEl = document.getElementById('list');
  const numEl = document.getElementById('memoNum');
  const timeEl = document.getElementById('memoTime');
  let memoSig = '';       // 上一次渲染的内容签名：没变就不重建，免得正在点的那条被换掉
  let knownIds = null;    // 上次见过的待办 id，用来认出「新来的」
  let pendingDone = {};   // 刚点过的 id -> 想改成的状态，等下一轮 state 确认

  function hmNow() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function renderMemo(memo) {
    const items = (memo && memo.items) || [];
    const stats = (memo && memo.stats) || { total: items.length, done: 0, open: items.length };

    timeEl.textContent = memo && memo.at ? hmNow() : '';

    // 新来的条目：认出来标一下，顺便让桌宠说一句
    const ids = new Set(items.map((x) => x.id));
    const freshIds = new Set();
    if (knownIds) {
      for (const x of items) if (!x.done && !knownIds.has(x.id)) freshIds.add(x.id);
      if (freshIds.size) {
        const one = items.find((x) => freshIds.has(x.id));
        say('新来一件：' + ((one && one.text) || '').slice(0, 24));
        play('happy', 1100);
        toast('清单更新：新增 ' + freshIds.size + ' 条');
      }
    }
    knownIds = ids;

    // 点击后到 state 回来之间，先按用户的意思画，别让勾选跳回去
    const shown = items.map((x) => {
      const want = pendingDone[x.id];
      return want === undefined ? x : Object.assign({}, x, { done: want });
    });
    const doneN = shown.filter((x) => x.done).length;
    const totalN = Math.max(stats.total || 0, shown.length);
    numEl.textContent = totalN ? doneN + '/' + totalN : '0';

    const sig = shown.map((x) => x.id + (x.done ? '1' : '0')).join('|') + '#' + stats.total;
    if (sig === memoSig) return;
    memoSig = sig;

    if (!shown.length) {
      listEl.innerHTML = '';
      const e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = '今天还没有待办<span>清单每小时会重跑一次</span>';
      listEl.appendChild(e);
      return;
    }

    const frag = document.createDocumentFragment();
    for (const it of shown) {
      const row = document.createElement('div');
      row.className = 'item' + (it.done ? ' done' : '') + (freshIds.has(it.id) ? ' flash' : '');
      row.dataset.id = it.id;

      const box = document.createElement('span');
      box.className = 'box';
      box.textContent = '✓';

      const tx = document.createElement('div');
      const tt = document.createElement('div');
      tt.className = 'tt';
      tt.textContent = it.text || '';   // textContent：清单内容是别人发的消息，不能当 HTML
      tx.appendChild(tt);

      const meta = [it.chat, it.hm].filter(Boolean).join(' · ');
      if (meta) {
        const mt = document.createElement('div');
        mt.className = 'mt';
        mt.textContent = meta;
        tx.appendChild(mt);
      }

      row.appendChild(box);
      row.appendChild(tx);
      row.onclick = () => toggle(it);
      frag.appendChild(row);
    }
    listEl.innerHTML = '';
    listEl.appendChild(frag);
  }

  let busy = {};
  async function toggle(it) {
    if (busy[it.id]) return;
    busy[it.id] = true;
    const want = !it.done;
    pendingDone[it.id] = want;
    // 先把本地画成点击后的样子，服务端确认后由下一轮 state 对齐
    let row = null;
    for (const el of listEl.children) {
      if (el.dataset && el.dataset.id === String(it.id)) { row = el; break; }
    }
    if (row) row.classList.toggle('done', want);
    if (want) play('happy', 800);

    const d = await send('memotoggle', { id: it.id });
    busy[it.id] = false;
    if (!d || d.error) {
      delete pendingDone[it.id];
      memoSig = '';
      toast('没改成，稍后再试', true);
      return;
    }
    // 成功：让下一轮 state 说真话
    setTimeout(() => { delete pendingDone[it.id]; }, 2500);
  }

  /* ---------------- 轮询 ---------------- */
  let lastSeenResult = 0;
  let primed = false;

  function render(state) {
    setConn(!!state.online);
    document.getElementById('host').textContent = state.host ? '· ' + state.host : '';
    renderMemo(state.memo);

    // 新结果：说话类冒气泡，动作类弹提示
    const results = state.results || [];
    if (!primed) {
      // 首屏只对齐到最新一条，不重放历史：服务器缓存最近 40 条结果，
      // 全放一遍的话一打开页面就连弹十几个提示
      lastSeenResult = results.length ? results[results.length - 1].at : 0;
      primed = true;
      return;
    }
    for (const r of results) {
      if (r.at <= lastSeenResult) continue;
      lastSeenResult = r.at;
      if (r.cmd === 'say') {
        say(r.message || '（没说话）');
        if (/图|照片|表情/.test(r.message || '')) play('happy', 1000);
      } else if (r.cmd === 'pet') {
        if (r.ok) say(r.message || '嗯？');
      } else if (r.cmd === 'memotoggle') {
        if (!r.ok) toast(r.message || '没改成', true);
      } else if (r.cmd === 'memorefresh') {
        toast(r.message || '已刷新', !r.ok);
      } else if (!r.ok) {
        toast(r.message || '失败', true);
      }
    }
  }

  async function tick() {
    if (!token) return;
    try {
      const r = await fetch(api('api/state'), { cache: 'no-store' });
      if (r.status === 401) {
        localStorage.removeItem('desk_token');
        token = '';
        gate.classList.add('show');
        return;
      }
      render(await r.json());
    } catch (e) {
      setConn(false);
    }
  }

  tick();
  // 2 秒一轮：勾一条要马上看到变灰，等太久会以为没点上
  setInterval(tick, 2000);
  // APK 壳从后台回到前台时会调这个：锁屏期间 JS 定时器被挂起，
  // 不立刻拉一次的话画面上还是几分钟前的状态
  window.__deskRefresh = tick;
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

  /* ---------------- 指令 ---------------- */
  async function send(cmd, args) {
    try {
      const r = await fetch(api('api/cmd'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cmd, args: args || {} })
      });
      const d = await r.json();
      if (d.error) return toast('口令无效', true), null;
      if (!d.online) toast('电脑离线，等它上线才会执行');
      return d;
    } catch (e) {
      return toast('发不出去：' + e.message, true), null;
    }
  }

  /* ---------------- 桌宠互动 ---------------- */
  cvs.addEventListener('click', () => poke());
  function poke() {
    if (!online) { play('sad', 1200); return; }
    play('happy', 900);
    say('嗯？');
    send('pet', { action: 'poke' });
  }
  document.getElementById('btnPoke').onclick = poke;
  document.getElementById('btnWalk').onclick = async () => {
    if (!online) return play('sad', 1200);
    toast('让它溜达一圈');
    await send('pet', { action: 'walk' });
  };

  document.getElementById('btnSync').onclick = async (e) => {
    const b = e.currentTarget;
    b.classList.add('spin');
    setTimeout(() => b.classList.remove('spin'), 700);
    await send('memorefresh');
  };

  /* ---------------- 对话 ---------------- */
  const input = document.getElementById('msg');
  async function submit() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    say(text); // 先把自己说的显示出来，别像石沉大海
    play('think', 6000);
    await send('say', { text });
  }
  document.getElementById('btnSend').onclick = submit;
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });

  // 在 APK 壳里打开时不显示安装入口：WebView 的 UA 里带 "; wv"
  if (!/;\s*wv\)/.test(navigator.userAgent)) {
    document.getElementById('getApp').classList.add('show');
  }
})();
</script>
</body>
</html>
