<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';"
    />
    <title>比格多栋</title>
    <link rel="stylesheet" href="bubble.css" />
  </head>
  <body data-side="left">
    <!-- 主界面：日漫云朵对话框（形状由 bubble.js 按实际尺寸生成） -->
    <section id="view-chat" class="view">
      <svg class="cloud" aria-hidden="true">
        <path class="cloud-path" />
      </svg>

      <!-- 云朵外的「句号」 -->
      <div class="cloud-dot" aria-hidden="true"></div>

      <div class="cloud-inner">
        <main id="chat" class="chat"></main>

        <div class="composer">
          <textarea id="input" rows="1"></textarea>
          <button id="btn-send" class="send-btn" title="发送 (Enter)">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 19V5M5 12l7-7 7 7" />
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- 设置界面：标准面板 -->
    <section id="view-settings" class="view hidden">
      <div class="tail"></div>
      <div class="shell">
        <header class="titlebar">
          <div class="brand">
            <button id="btn-back" class="icon-btn" title="返回">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
            </button>
            <span class="name">设置</span>
          </div>
          <div class="tools">
            <button id="btn-settings-close" class="icon-btn" title="收起 (Esc)">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6 6 18M6 6l12 12" />
              </svg>
            </button>
          </div>
        </header>

        <div class="settings-body">
          <div class="field-group">
            <div class="group-title">智能模式</div>

            <label class="switch-row">
              <span>启用模型</span>
              <input type="checkbox" id="llm-enabled" />
              <span class="switch"></span>
            </label>

            <label class="field">
              <span>接口地址</span>
              <input type="text" id="llm-baseurl" />
            </label>

            <label class="field">
              <span>API Key</span>
              <input type="password" id="llm-apikey" />
            </label>

            <label class="field">
              <span>模型名</span>
              <input type="text" id="llm-model" />
            </label>
          </div>

          <div class="field-group">
            <div class="group-title">性格</div>

            <div class="field">
              <span>语气</span>
              <div class="persona-row" id="persona-presets"></div>
            </div>

            <div class="field">
              <span>回复长度</span>
              <div class="persona-row" id="persona-lengths"></div>
            </div>

            <label class="switch-row">
              <span>允许 emoji</span>
              <input type="checkbox" id="persona-emoji" />
              <span class="switch"></span>
            </label>

            <label class="field">
              <span>自称</span>
              <input type="text" id="persona-name" />
            </label>

            <label class="field">
              <span>额外要求</span>
              <textarea id="persona-signature" rows="2"></textarea>
            </label>
          </div>

          <div class="field-group">
            <div class="group-title">行为</div>
            <label class="switch-row">
              <span>开机自动启动</span>
              <input type="checkbox" id="auto-launch" />
              <span class="switch"></span>
            </label>
            <label class="switch-row">
              <span>让它自己溜达</span>
              <input type="checkbox" id="auto-idle" />
              <span class="switch"></span>
            </label>
            <label class="field">
              <span>对话快捷键</span>
              <input type="text" id="shortcut" />
            </label>
            <label class="field">
              <span>显隐桌宠快捷键</span>
              <input type="text" id="pet-shortcut" />
            </label>
          </div>

          <div class="field-group">
            <div class="group-title">提醒</div>
            <div id="reminder-list" class="reminder-list"></div>
          </div>

          <div class="settings-actions">
            <button id="btn-save" class="primary-btn">保存</button>
            <button id="btn-quit" class="ghost-btn">退出桌宠</button>
          </div>
        </div>
      </div>
    </section>

    <script src="bubble.js"></script>
  </body>
</html>
